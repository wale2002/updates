<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpportunityNG Editorial</title><style>
:root{--ink:#10251e;--green:#087a55;--deep:#0d3328;--paper:#f5f8f6;--line:#d9e5de;--gold:#f4bf4e;--muted:#697b73}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'Segoe UI',Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1280px,calc(100% - 32px));margin:auto}.top{background:var(--deep);color:white}.topin{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.1rem;font-weight:850}.brand b{color:#58d1a6}.top a{color:#cae0d7;text-decoration:none}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:26px 18px;background:white}aside strong{display:block;margin:0 10px 12px;color:#7a8a83;font-size:.7rem;letter-spacing:.12em}aside button{width:100%;border:0;border-radius:8px;padding:10px 12px;background:transparent;text-align:left;color:#40564d;font-weight:700}aside button.active,aside button:hover{background:#e9f4ee;color:var(--green)}main{padding:34px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.head h1{margin:0;font:500 2.4rem Georgia,serif;letter-spacing:-.04em}.head p{margin:5px 0;color:var(--muted)}.primary,.secondary{border:0;border-radius:8px;padding:10px 15px;font-weight:800}.primary{background:var(--green);color:white}.secondary{border:1px solid var(--line);background:white;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:12px;padding:17px;background:white}.stat span{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;margin-top:4px;font:500 2rem Georgia,serif}.panel{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:500 1.35rem Georgia,serif}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px 16px;border-bottom:1px solid #e8eeea;text-align:left;vertical-align:top}th{color:#75857e;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em}td small{display:block;color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf3ef;color:#496258;font-size:.68rem;font-weight:850;text-transform:uppercase}.pill.published{background:#e0f3e8;color:#087a55}.pill.approved{background:#e9effd;color:#3659a9}.actions{display:flex;gap:6px}.actions button{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:white;font-size:.72rem;font-weight:750}.empty{padding:52px;text-align:center;color:var(--muted)}dialog{width:min(760px,calc(100% - 24px));max-height:calc(100vh - 28px);border:0;border-radius:16px;padding:0;box-shadow:0 30px 100px #00140e66}dialog::backdrop{background:#071b15b8}.dialog-head{display:flex;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font:500 1.6rem Georgia,serif}.dialog-head button{border:0;background:transparent;font-size:1.4rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:23px}.form label{display:grid;gap:6px;color:#4f635a;font-size:.78rem;font-weight:750}.form .wide{grid-column:1/-1}.form input,.form textarea,.form select{width:100%;border:1px solid #cbd9d1;border-radius:8px;padding:10px;background:white;color:var(--ink)}.form textarea{min-height:82px;resize:vertical}.dialog-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;padding-top:4px}.notice{border:1px solid #ead79b;border-radius:10px;padding:13px;background:#fff8e5;color:#6c5520}.blocked{max-width:580px;margin:70px auto;text-align:center;border:1px solid var(--line);border-radius:16px;padding:35px;background:white}.blocked h1{font:500 2rem Georgia,serif}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:11px 17px;border-radius:99px;background:#102d24;color:white;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:24px 16px}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}@media(max-width:520px){.stats{grid-template-columns:1fr}.head{display:grid;gap:14px}}
</style></head><body><header class="top"><div class="shell topin"><div class="brand">Opportunity<b>NG</b> · Editorial</div><a href="/">View public site</a></div></header><div id="app"><div class="blocked"><h1>Checking editorial access…</h1><p>Please wait while OpportunityNG verifies your signed-in account.</p></div></div><dialog id="editor"><form class="form" id="opportunityForm"><div class="dialog-head wide"><h2>New opportunity</h2><button type="button" id="closeEditor" aria-label="Close">×</button></div><label>Title<input name="title" required></label><label>Category<input name="category" required placeholder="Training"></label><label>Programme owner<input name="provider" required></label><label>Official domain<input name="officialDomain" required placeholder="agency.gov.ng"></label><label class="wide">Summary<textarea name="summary" required></textarea></label><label>Benefit<input name="benefit"></label><label>Location<input name="location" value="Nigeria"></label><label>Opening date<input name="openingDate" type="date"></label><label>Deadline<input name="deadline" type="date"></label><label class="wide">Primary source URL<input name="officialSourceUrl" type="url" required placeholder="https://agency.gov.ng/programme"></label><label class="wide">Exact application URL<input name="applicationUrl" type="url" required placeholder="https://apply.agency.gov.ng/programme"></label><label class="wide">Eligibility, one item per line<textarea name="eligibility"></textarea></label><label class="wide">Requirements, one item per line<textarea name="requirements"></textarea></label><div class="dialog-foot"><button type="button" class="secondary" id="cancelEditor">Cancel</button><button class="primary">Save draft</button></div></form></dialog><div class="toast" id="toast" role="status"></div><script>
const app=document.getElementById('app'),editor=document.getElementById('editor');let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||'Request failed');return body}function layout(me){app.innerHTML=`<div class="layout"><aside><strong>EDITORIAL</strong><button class="active">Overview</button><button>Opportunities</button><button>Sources</button><button>Reports</button><button>Analytics</button><button>Subscribers</button><button>Audit log</button></aside><main><div class="head"><div><h1>Editorial workspace</h1><p>Signed in as ${esc(me.email)} · ${esc(me.role)}</p></div><button class="primary" id="newOpportunity">New opportunity</button></div><div class="stats" id="stats"></div><section class="panel"><div class="panel-head"><h2>Opportunity pipeline</h2><button class="secondary" id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Opportunity</th><th>Status</th><th>Verification</th><th>Deadline</th><th>Actions</th></tr></thead><tbody id="table"></tbody></table></div></section></main></div>`;document.getElementById('newOpportunity').onclick=()=>editor.showModal();document.getElementById('refresh').onclick=load;load()}
function render(){const counts=rows.reduce((a,r)=>(a[r.editorialStatus]=(a[r.editorialStatus]||0)+1,a),{});document.getElementById('stats').innerHTML=[['Draft',counts.draft||0],['Awaiting verification',counts.awaiting_verification||0],['Published',counts.published||0],['Total',rows.length]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.getElementById('table').innerHTML=rows.length?rows.map(r=>`<tr><td><strong>${esc(r.title)}</strong><small>${esc(r.provider)} · ${esc(r.category)}</small></td><td><span class="pill ${r.editorialStatus}">${esc(r.editorialStatus.replaceAll('_',' '))}</span></td><td>${esc(r.verificationStatus)}</td><td>${esc(r.deadline||'Not stated')}</td><td><div class="actions">${r.editorialStatus==='draft'?`<button data-review="${r.id}">Send to review</button>`:''}${r.editorialStatus==='awaiting_verification'?`<button data-verify="${r.id}">Verify</button>`:''}${r.editorialStatus==='approved'?`<button data-publish="${r.id}">Publish</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No opportunities yet. Create the first draft to begin the editorial workflow.</td></tr>`}
async function load(){const d=await api('/api/admin/opportunities');rows=d.opportunities;render()}document.addEventListener('click',async e=>{const review=e.target.closest('[data-review]'),verify=e.target.closest('[data-verify]'),publish=e.target.closest('[data-publish]');try{if(review){await api(`/api/admin/opportunities/${review.dataset.review}`,{method:'PUT',body:JSON.stringify({editorialStatus:'awaiting_verification'})});toast('Sent to verification');load()}if(verify){const row=rows.find(x=>x.id==verify.dataset.verify);await api(`/api/admin/opportunities/${row.id}/verify`,{method:'POST',body:JSON.stringify({primarySourceUrl:row.officialSourceUrl,applicationUrl:row.applicationUrl,programmeOwner:row.provider,officialDomain:row.officialDomain,deadlineConfirmed:Boolean(row.deadline),score:92,notes:'Human review completed in OpportunityNG editorial.'})});toast('Verification recorded');load()}if(publish){await api(`/api/admin/opportunities/${publish.dataset.publish}/publish`,{method:'POST'});toast('Opportunity published');load()}}catch(err){toast(err.message)}});document.getElementById('closeEditor').onclick=()=>editor.close();document.getElementById('cancelEditor').onclick=()=>editor.close();document.getElementById('opportunityForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.eligibility=data.eligibility.split(/\n/).filter(Boolean);data.requirements=data.requirements.split(/\n/).filter(Boolean);try{await api('/api/admin/opportunities',{method:'POST',body:JSON.stringify(data)});editor.close();e.target.reset();toast('Draft saved');load()}catch(err){toast(err.message)}};
async function boot(){try{const me=await api('/api/admin/me');layout(me)}catch{app.innerHTML=`<div class="blocked"><div class="notice">Editorial access has not been initialized for this private site.</div><h1>Activate the owner workspace</h1><p>The first signed-in owner becomes the super administrator. This action is recorded in the audit log.</p><button class="primary" id="bootstrap">Activate editorial access</button></div>`;document.getElementById('bootstrap').onclick=async()=>{try{const me=await api('/api/admin/bootstrap',{method:'POST'});layout(me)}catch(err){toast(err.message)}}}}boot();
</script></body></html>
